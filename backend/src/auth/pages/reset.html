<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="theme.css" />
    <title>Reset password — Video Transcript</title>
  </head>
  <body>
    <header class="brand">
      <span class="lantern" aria-hidden="true"></span>
      <div class="brand-text">
        <p class="brand-name">Video Transcript</p>
        <p class="brand-tagline">language reading room</p>
      </div>
    </header>
    <h1>Reset password</h1>
    <form id="reset-form">
      <label
        >New password <input id="password" type="password" required autocomplete="new-password"
      /></label>
      <label
        >Confirm password
        <input id="confirm-password" type="password" required autocomplete="new-password"
      /></label>
      <button type="submit">Set new password</button>
    </form>
    <p id="message" role="alert"></p>
    <script src="reset.js"></script>
  </body>
</html>
