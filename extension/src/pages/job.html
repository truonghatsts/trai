<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="theme.css" />
    <title>Transcript — Video Transcript</title>
  </head>
  <body>
    <header class="brand">
      <span class="lantern" aria-hidden="true"></span>
      <div class="brand-text">
        <p class="brand-name">Video Transcript</p>
        <p class="brand-tagline">language reading room</p>
      </div>
    </header>
    <h1>Transcript</h1>
    <div id="status">Loading…</div>
    <pre id="content" hidden></pre>
    <div id="error-box" hidden>
      <p id="error-message"></p>
      <button id="retry" hidden>Retry</button>
      <button id="verify-resend" hidden>Resend confirmation</button>
      <p><a id="signin-link" href="signin.html" hidden>Sign in again</a></p>
    </div>
    <div id="start-box" hidden>
      <p id="start-message"></p>
      <button id="start-transcribe">Transcribe</button>
    </div>
    <p><a href="history.html">History</a></p>
    <script src="job.js"></script>
  </body>
</html>
